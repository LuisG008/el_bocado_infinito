     <!-- Modal Crear-->
    <div class="modal fade" id="crearMenu" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Crear Menú</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="formAddMenu">
                    <div class="modal-body">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="nombre" name="nombre">
                            <label for="nombre">Titulo</label>
                        </div>
                        <div class="form-floating mb-3">
                            <textarea class="form-control"
                                id="descripcion" name="descripcion"></textarea>
                            <label for="descripcion">Descripción</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="precio" name="precio">
                            <label for="precio">Precio</label>
                        </div>
    
                        <div class="mb-3">
                            <label for="imagen" class="form-label">Cargar Imagen</label>
                            <input class="form-control" type="file" id="imagen" name="imagen" accept=".jpg,.jpeg,.png">
                        </div>
    
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="publicar" name="publicar">
                            <label class="form-check-label" for="publicar">Publicar</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-warning">Continuar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <!--  -->

    <!-- Modal editar-->
    <div class="modal fade" id="editarMenu" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Editar Menú</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="formEditMenu">
                    <input type="hidden" class="form-control" id="idmenu">

                    <div class="modal-body">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="nombreEdit" name="nombreEdit" placeholder="name@example.com">
                            <label for="nombreEdit">Titulo</label>
                        </div>
                        <div class="form-floating">
                            <textarea class="form-control mb-3" placeholder="Leave a comment here"
                                id="descripcionEdit" name="descripcionEdit"></textarea>
                            <label for="descripcionEdit">Descripción</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="number" class="form-control" id="precioEdit" name="precioEdit" placeholder="name@example.com">
                            <label for="precioEdit">Precio</label>
                        </div>
    
                        <div class="mb-3">
                            <label for="imagenEdit" class="form-label">Cargar Imagen</label>
                            <input class="form-control" type="file" id="imagenEdit" name="imagenEdit" accept=".jpg,.jpeg,.png">
                        </div>
    
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="publicarEdit" name="publicarEdit">
                            <label class="form-check-label" for="publicarEdit">Publicar</label>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-warning">Continuar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
